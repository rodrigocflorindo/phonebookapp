name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        id: diff
        run: |
          gh pr diff ${{ github.event.pull_request.number }} > pr_diff.txt
          echo "diff_file=pr_diff.txt" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Anthropic SDK
        run: pip install anthropic

      - name: Run Claude Code Review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 << 'EOF'
          import os
          import anthropic
          import subprocess

          # Read the PR diff
          with open('pr_diff.txt', 'r') as f:
              diff = f.read()

          # Create Claude client
          api_key = os.environ.get('ANTHROPIC_API_KEY')
          if not api_key:
              raise SystemExit(
                  "ANTHROPIC_API_KEY is not set. Add it as a repository secret "
                  "(Settings > Secrets and variables > Actions)."
              )
          client = anthropic.Anthropic(api_key=api_key)

          # Request code review from Claude
          message = client.messages.create(
              model="claude-sonnet-4-5-20250929",
              max_tokens=4096,
              messages=[{
                  "role": "user",
                  "content": f"""Review this pull request diff and provide constructive feedback.

          Focus on:
          - Code quality and best practices
          - Potential bugs or issues
          - Security concerns
          - Performance improvements
          - Suggestions for better implementation

          PR Diff:
          ```
          {diff}
          ```

          Provide your review in a clear, helpful format."""
              }]
          )

          review_comment = message.content[0].text

          # Post review as PR comment
          pr_number = os.environ['PR_NUMBER']
          subprocess.run([
              'gh', 'pr', 'comment', pr_number,
              '--body', f"## 🤖 Claude Code Review\n\n{review_comment}"
          ], env=os.environ, check=True)

          print("✅ Review posted successfully!")
          EOF
