apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  phonebook-dashboard.json: |
    {
      "title": "Phonebook App Metrics",
      "tags": ["phonebookapp", "prometheus"],
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "10s",
      "panels": [
        {
          "id": 1,
          "title": "HTTP Request Rate",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "expr": "rate(phonebookapp_http_requests_total[5m])",
              "legendFormat": "{{method}} {{endpoint}} ({{status}})",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never"
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "showLegend": true,
              "calcs": ["mean", "lastNotNull", "max"]
            }
          }
        },
        {
          "id": 2,
          "title": "HTTP Request Duration (p95)",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, rate(phonebookapp_http_request_duration_seconds_bucket[5m]))",
              "legendFormat": "{{method}} {{endpoint}} (p95)",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.50, rate(phonebookapp_http_request_duration_seconds_bucket[5m]))",
              "legendFormat": "{{method}} {{endpoint}} (p50)",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never"
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "showLegend": true,
              "calcs": ["mean", "lastNotNull", "max"]
            }
          }
        },
        {
          "id": 3,
          "title": "HTTP Requests In Progress",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "targets": [
            {
              "expr": "phonebookapp_http_requests_in_progress",
              "legendFormat": "{{method}} {{endpoint}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never"
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "showLegend": true,
              "calcs": ["lastNotNull"]
            }
          }
        },
        {
          "id": 4,
          "title": "Database Operations Rate",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "targets": [
            {
              "expr": "rate(phonebookapp_db_operations_total[5m])",
              "legendFormat": "{{operation}} on {{table}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never"
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "showLegend": true,
              "calcs": ["mean", "lastNotNull", "max"]
            }
          }
        },
        {
          "id": 5,
          "title": "HTTP Status Codes",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "targets": [
            {
              "expr": "sum by (status) (rate(phonebookapp_http_requests_total[5m]))",
              "legendFormat": "Status {{status}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "stacking": {
                  "mode": "normal"
                }
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "showLegend": true,
              "calcs": ["mean", "lastNotNull"]
            }
          }
        },
        {
          "id": 6,
          "title": "Error Rate (4xx + 5xx)",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 16
          },
          "targets": [
            {
              "expr": "sum(rate(phonebookapp_http_requests_total{status=~\"4..|5..\"}[5m])) / sum(rate(phonebookapp_http_requests_total[5m])) * 100",
              "legendFormat": "Error Rate %",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 3
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "showLegend": true,
              "calcs": ["mean", "lastNotNull", "max"]
            }
          }
        }
      ]
    }
  kubernetes-cluster-dashboard.json: |
    {
      "title": "Kubernetes Cluster Health",
      "tags": ["kubernetes", "cluster", "monitoring"],
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "title": "Cluster Overview - Total Nodes",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "targets": [{"expr": "count(kube_node_info)", "refId": "A"}],
          "options": {"reduceOptions": {"values": false, "calcs": ["lastNotNull"]}},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]}, "unit": "short"}}
        },
        {
          "id": 2,
          "title": "Total Pods",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
          "targets": [{"expr": "sum(kube_pod_info)", "refId": "A"}],
          "options": {"reduceOptions": {"values": false, "calcs": ["lastNotNull"]}},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]}, "unit": "short"}}
        },
        {
          "id": 3,
          "title": "Running Pods",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
          "targets": [{"expr": "sum(kube_pod_status_phase{phase=\"Running\"})", "refId": "A"}],
          "options": {"reduceOptions": {"values": false, "calcs": ["lastNotNull"]}},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]}, "unit": "short"}}
        },
        {
          "id": 4,
          "title": "Failed Pods",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
          "targets": [{"expr": "sum(kube_pod_status_phase{phase=\"Failed\"}) OR on() vector(0)", "refId": "A"}],
          "options": {"reduceOptions": {"values": false, "calcs": ["lastNotNull"]}},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}, "unit": "short"}}
        },
        {
          "id": 5,
          "title": "CPU Usage by Node",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "targets": [{"expr": "100 - (avg by (instance) (irate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)", "legendFormat": "{{instance}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "percent", "custom": {"drawStyle": "line", "lineWidth": 2, "fillOpacity": 10}}},
          "options": {"legend": {"displayMode": "table", "showLegend": true, "calcs": ["mean", "lastNotNull", "max"]}}
        },
        {
          "id": 6,
          "title": "Memory Usage by Node",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
          "targets": [{"expr": "(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100", "legendFormat": "{{instance}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "percent", "custom": {"drawStyle": "line", "lineWidth": 2, "fillOpacity": 10}}},
          "options": {"legend": {"displayMode": "table", "showLegend": true, "calcs": ["mean", "lastNotNull", "max"]}}
        },
        {
          "id": 7,
          "title": "Pods by Namespace",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
          "targets": [{"expr": "sum by (namespace) (kube_pod_info)", "legendFormat": "{{namespace}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "short", "custom": {"drawStyle": "line", "lineWidth": 2, "fillOpacity": 10}}},
          "options": {"legend": {"displayMode": "table", "showLegend": true, "calcs": ["lastNotNull"]}}
        },
        {
          "id": 8,
          "title": "Pod Restarts (Last 5m)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
          "targets": [{"expr": "sum by (namespace) (increase(kube_pod_container_status_restarts_total[5m]))", "legendFormat": "{{namespace}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "short", "custom": {"drawStyle": "line", "lineWidth": 2, "fillOpacity": 10}}},
          "options": {"legend": {"displayMode": "table", "showLegend": true, "calcs": ["lastNotNull", "max"]}}
        },
        {
          "id": 9,
          "title": "Node Disk Usage",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 20},
          "targets": [{"expr": "(1 - (node_filesystem_avail_bytes{mountpoint=\"/\",fstype!=\"tmpfs\"} / node_filesystem_size_bytes{mountpoint=\"/\",fstype!=\"tmpfs\"})) * 100", "legendFormat": "{{instance}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "percent", "custom": {"drawStyle": "line", "lineWidth": 2, "fillOpacity": 10}}},
          "options": {"legend": {"displayMode": "table", "showLegend": true, "calcs": ["mean", "lastNotNull", "max"]}}
        },
        {
          "id": 10,
          "title": "Network I/O",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 20},
          "targets": [
            {"expr": "sum(rate(node_network_receive_bytes_total{device!=\"lo\"}[5m])) by (instance)", "legendFormat": "{{instance}} RX", "refId": "A"},
            {"expr": "sum(rate(node_network_transmit_bytes_total{device!=\"lo\"}[5m])) by (instance)", "legendFormat": "{{instance}} TX", "refId": "B"}
          ],
          "fieldConfig": {"defaults": {"unit": "Bps", "custom": {"drawStyle": "line", "lineWidth": 2, "fillOpacity": 10}}},
          "options": {"legend": {"displayMode": "table", "showLegend": true, "calcs": ["mean", "lastNotNull", "max"]}}
        },
        {
          "id": 11,
          "title": "Pod Status by Phase",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 28},
          "targets": [{"expr": "sum by (phase) (kube_pod_status_phase)", "legendFormat": "{{phase}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "short", "custom": {"drawStyle": "line", "lineWidth": 2, "fillOpacity": 10}}},
          "options": {"legend": {"displayMode": "table", "showLegend": true, "calcs": ["lastNotNull"]}}
        },
        {
          "id": 12,
          "title": "Deployments - Available vs Desired Replicas",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 28},
          "targets": [
            {"expr": "sum by (deployment, namespace) (kube_deployment_status_replicas_available)", "legendFormat": "{{namespace}}/{{deployment}} (available)", "refId": "A"},
            {"expr": "sum by (deployment, namespace) (kube_deployment_spec_replicas)", "legendFormat": "{{namespace}}/{{deployment}} (desired)", "refId": "B"}
          ],
          "fieldConfig": {"defaults": {"unit": "short", "custom": {"drawStyle": "line", "lineWidth": 2, "fillOpacity": 10}}},
          "options": {"legend": {"displayMode": "table", "showLegend": true, "calcs": ["lastNotNull"]}}
        }
      ]
    }
